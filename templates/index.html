<!DOCTYPE html>
<html>
<head>
    <title>Insurance Charge Prediction</title>

    <style>
        body {
            background-color: #e6f2ff; /* light blue background */
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
        }

        h1 {
            color: #004080;
            margin-top: 30px;
        }

        .container {
            background-color: #ffffff;
            width: 400px;
            margin: 30px auto;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        label {
            font-weight: bold;
            display: block;
            margin-top: 10px;
            text-align: left;
        }

        input, select {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        input[type="submit"] {
            background-color: #3399ff;
            color: white;
            border: none;
            margin-top: 15px;
            cursor: pointer;
            font-weight: bold;
        }

        input[type="submit"]:hover {
            background-color: #0073e6;
        }

        .prediction {
            margin-top: 20px;
            color: #006600;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>Insurance Charge Prediction</h1>

    <div class="container">
        <form method="POST" action="/predict">
            
            <label>Age:</label>
            <input type="number" name="age" required>

            <label>Sex:</label>
            <select name="sex">
                <option value="male">Male</option>
                <option value="female">Female</option>
            </select>

            <label>BMI:</label>
            <input type="number" step="0.1" name="bmi" required>

            <label>Children:</label>
            <input type="number" name="children" required>

            <label>Smoker:</label>
            <select name="smoker">
                <option value="yes">Yes</option>
                <option value="no">No</option>
            </select>

            <label>Region:</label>
            <select name="region">
                <option value="southeast">Southeast</option>
                <option value="southwest">Southwest</option>
                <option value="northeast">Northeast</option>
                <option value="northwest">Northwest</option>
            </select>

            <input type="submit" value="Predict">
        </form>

        {% if prediction %}
        <div class="prediction">
            Predicted Insurance Charge: ${{ prediction }}
        </div>
        {% endif %}
    </div>

</body>
</html>
